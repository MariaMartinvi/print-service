services:
  - type: web
    name: print-service
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GELATO_API_KEY
        sync: false          # se pone a mano en el dashboard de Render
      - key: SERVICE_API_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false          # cadena de conexión de Supabase (Postgres)
      - key: DEFAULT_CURRENCY
        value: EUR
      - key: RETURN_COMPANY
        value: Comartinvi S.L.
      - key: RETURN_EMAIL
        sync: false
